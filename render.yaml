services:
  - type: web
    name: slyce-backend
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @slyyce/backend db:generate && pnpm --filter @slyyce/backend build
    preDeployCommand: pnpm --filter @slyyce/backend deployment:check && pnpm --filter @slyyce/backend db:migrate:deploy
    startCommand: pnpm --filter @slyyce/backend start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_CA_CERT
        sync: false
      - key: SLYCE_ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_SESSION_SECRET
        sync: false
      - key: GOODDOLLAR_ENV
        value: production
      - key: GOODDOLLAR_RPC_URL
        sync: false
      - key: GOODDOLLAR_IDENTITY_ADDRESS
        sync: false
      - key: SLYYCE_ARCADE_ADDRESS
        value: '0xACbB0ABF3Cb485b64eB2707CF8E4B69AC25C43A6'
      - key: SLYYCE_TOURNAMENT_ADDRESS
        value: '0xA4964F4D3143142a509932FF6EaB04005e319Baa'
      - key: SLYYCE_SHOP_ADDRESS
        value: '0x091606F02607222D5DF21DBf3C25939102528Cc1'
      - key: SLYYCE_CONTRACTS_START_BLOCK
        value: '81391119'
